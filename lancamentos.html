<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roadmap de Lançamentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ Design tokens ============ */
:root{
  --bg: #F3F4F7;
  --panel: #FFFFFF;
  --ink: #15182B;
  --ink-soft: #565B72;
  --line: #DEE1EA;
  --line-soft: #EBEDF2;
  --accent: #1B2559;
  --accent-soft: #E9EBF5;
  --danger: #C23B3B;
  --radius: 10px;
  --font-display: 'Space Grotesk', sans-serif;
  --font-body: 'Inter', sans-serif;

  --status-concluido-bg: #E4F5EC;
  --status-concluido-text: #14602F;
  --status-atrasado-bg: #FBE7E7;
  --status-atrasado-text: #8A1F1F;
  --status-andamento-bg: transparent;
  --status-andamento-text: #15182B;
}

*{ box-sizing: border-box; }

html,body{
  margin:0;
  padding:0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}

.app{
  max-width: 1240px;
  margin: 0 auto;
  padding: 40px 32px 80px;
}

/* ============ Topbar ============ */
.topbar{
  display:flex;
  justify-content: space-between;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 20px;
  margin-bottom: 28px;
}

.year-nav{
  display:flex;
  align-items:center;
  gap: 14px;
}

.year-nav h1{
  font-family: var(--font-display);
  font-size: 40px;
  font-weight: 700;
  margin: 0;
  letter-spacing: -0.01em;
}

.year-arrow{
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: border-color .15s ease, background .15s ease;
}
.year-arrow:hover{ border-color: var(--accent); background: var(--accent-soft); }

.subtitle{
  margin: 4px 0 0;
  color: var(--ink-soft);
  font-size: 15px;
}

.topbar-actions{
  display:flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}

button{ font-family: var(--font-body); }

.btn-primary, .btn-ghost, .btn-danger{
  border-radius: 8px;
  padding: 10px 16px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
  transition: opacity .15s ease, background .15s ease;
}
.btn-primary{
  background: var(--accent);
  color: #fff;
}
.btn-primary:hover{ opacity: .88; }
.btn-primary:disabled{ opacity: .45; cursor: not-allowed; }

.btn-ghost{
  background: var(--panel);
  color: var(--ink);
  border-color: var(--line);
}
.btn-ghost:hover{ border-color: var(--accent); }
.btn-ghost:disabled{ opacity: .45; cursor: not-allowed; }

.btn-danger{
  background: #fff;
  color: var(--danger);
  border-color: #EFC9C9;
}
.btn-danger:hover{ background: #FBEEEE; }

/* ============ Filters ============ */
.filter-row{
  display:flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 36px;
}

.filter-chip{
  display:flex;
  align-items:center;
  gap: 7px;
  padding: 6px 12px 6px 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--panel);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  color: var(--ink-soft);
  transition: border-color .15s ease, color .15s ease, background .15s ease;
}
.filter-chip .dot{
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.filter-chip.active{
  color: var(--ink);
  border-color: currentColor;
  background: var(--accent-soft);
}

/* ============ Sections ============ */
.board-section{ margin-bottom: 52px; }

.section-heading{
  display:flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 18px;
}
.section-heading h2{
  font-family: var(--font-display);
  font-size: 21px;
  font-weight: 600;
  margin: 0;
}
.section-count{
  font-size: 13px;
  color: var(--ink-soft);
}

/* ============ Quarter grid ============ */
.quarter-grid{
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
}

.quarter-col{
  background: var(--panel);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  padding: 18px 16px 20px;
  position: relative;
  overflow: hidden;
  min-height: 160px;
}

.quarter-col::before{
  content: attr(data-qnum);
  position: absolute;
  top: -18px;
  right: -6px;
  font-family: var(--font-display);
  font-size: 92px;
  font-weight: 700;
  color: var(--line-soft);
  line-height: 1;
  z-index: 0;
  pointer-events: none;
}

.quarter-header{
  position: relative;
  z-index: 1;
  margin-bottom: 14px;
}
.quarter-header .qlabel{
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 700;
  display:block;
}
.quarter-header .qmonths{
  font-size: 12.5px;
  color: var(--ink-soft);
}

.quarter-cards{
  position: relative;
  z-index: 1;
}

.quarter-empty{
  position: relative;
  z-index: 1;
  font-size: 13px;
  color: var(--ink-soft);
  padding: 10px 0;
}

/* month grouping */
.month-group{ position: relative; z-index: 1; margin-bottom: 14px; }
.month-group:last-child{ margin-bottom: 0; }
.month-name{
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-soft);
  margin: 0 0 6px;
}

/* ============ Launch box ============ */
.launch-box{
  border: 1.5px solid var(--ink);
  border-radius: 8px;
  padding: 9px 11px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: box-shadow .12s ease;
}
.launch-box:last-child{ margin-bottom: 0; }
.launch-box:hover{ box-shadow: 0 2px 8px rgba(21,24,43,0.1); }

.launch-box.status-concluido{ background: var(--status-concluido-bg); }
.launch-box.status-atrasado{ background: var(--status-atrasado-bg); }
.launch-box.status-andamento{ background: var(--status-andamento-bg); }

.launch-box .lb-name{
  font-size: 13px;
  font-weight: 600;
  margin: 0 0 5px;
  line-height: 1.3;
}
.status-concluido .lb-name{ color: var(--status-concluido-text); }
.status-atrasado .lb-name{ color: var(--status-atrasado-text); }
.status-andamento .lb-name{ color: var(--status-andamento-text); }

.launch-box .lb-meta{
  font-size: 11px;
  display:flex;
  align-items:center;
  gap: 5px;
  margin-bottom: 2px;
}
.launch-box .lb-desc{
  font-size: 11px;
  margin: 0;
}
.status-concluido .lb-meta, .status-concluido .lb-desc{ color: var(--status-concluido-text); opacity: .85; }
.status-atrasado .lb-meta, .status-atrasado .lb-desc{ color: var(--status-atrasado-text); opacity: .85; }
.status-andamento .lb-meta, .status-andamento .lb-desc{ color: var(--ink-soft); }

.lb-icon{
  width: 12px;
  height: 12px;
  flex-shrink: 0;
}

/* ============ Footer ============ */
.app-footer{
  margin-top: 40px;
  font-size: 12.5px;
  color: var(--ink-soft);
  text-align: center;
}

/* ============ Modal ============ */
.modal-overlay{
  position: fixed;
  inset: 0;
  background: rgba(21,24,43,0.45);
  display:flex;
  align-items:center;
  justify-content:center;
  padding: 20px;
  z-index: 100;
}
.modal-overlay.hidden{ display:none; }

.modal{
  background: #fff;
  border-radius: 12px;
  padding: 28px 26px;
  width: 100%;
  max-width: 480px;
  max-height: 90vh;
  overflow-y: auto;
}
.modal h2{
  font-family: var(--font-display);
  font-size: 20px;
  margin: 0 0 18px;
}

.field{
  display:flex;
  flex-direction: column;
  gap: 5px;
  margin-bottom: 14px;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-soft);
  flex: 1;
}
.field-row{
  display:flex;
  gap: 12px;
}
.field input, .field select, .field textarea{
  font-family: var(--font-body);
  font-size: 14px;
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 9px 10px;
  background: #fff;
  outline: none;
}
.field input:focus, .field select:focus, .field textarea:focus{
  border-color: var(--accent);
}
.field textarea{ resize: vertical; font-family: var(--font-body); }

.modal-actions{
  display:flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 20px;
}
.modal-actions-right{ display:flex; gap: 10px; }
.hidden{ display:none !important; }

/* View (image preview) modal */
.view-modal{ max-width: 720px; }
.view-image-wrap{
  background: var(--bg);
  border: 1px solid var(--line-soft);
  border-radius: 8px;
  min-height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  margin-bottom: 4px;
}
.view-loading{
  font-size: 13px;
  color: var(--ink-soft);
  margin: 0;
}
.view-image-wrap img{
  max-width: 100%;
  border-radius: 4px;
  display: block;
}

/* ============ Toast ============ */
.toast{
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--accent);
  color: #fff;
  padding: 11px 20px;
  border-radius: 8px;
  font-size: 13.5px;
  font-weight: 500;
  z-index: 200;
  box-shadow: 0 6px 18px rgba(21,24,43,0.2);
}

/* ============ Responsive ============ */
@media (max-width: 900px){
  .quarter-grid{ grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 600px){
  .app{ padding: 24px 16px 60px; }
  .quarter-grid{ grid-template-columns: 1fr; }
  .field-row{ flex-direction: column; }
  .topbar{ align-items: flex-start; }
  .year-nav h1{ font-size: 32px; }
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce){
  *{ transition: none !important; }
}

</style>
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="topbar-title">
      <div class="year-nav">
        <button id="prevYear" class="year-arrow" aria-label="Ano anterior">‹</button>
        <h1 id="yearLabel">2026</h1>
        <button id="nextYear" class="year-arrow" aria-label="Próximo ano">›</button>
      </div>
      <p class="subtitle">Lançamentos de produtos ao longo do ano</p>
    </div>
    <div class="topbar-actions">
      <button id="importBtn" class="btn-ghost">Importar dados</button>
      <input type="file" id="importFile" accept="application/json" hidden>
      <button id="exportBtn" class="btn-ghost">Exportar dados</button>
      <button id="viewBtn" class="btn-ghost">Visão</button>
      <button id="addBtn" class="btn-primary">Novo lançamento</button>
    </div>
  </header>

  <div id="categoryFilters" class="filter-row" aria-label="Filtrar por categoria"></div>

  <main>
    <section class="board-section">
      <div class="section-heading">
        <h2>Visão por trimestre</h2>
        <span id="gridCount" class="section-count"></span>
      </div>
      <div id="gridView" class="quarter-grid"></div>
    </section>
  </main>

  <footer class="app-footer">
    <span id="storageNote">Dados salvos neste navegador.</span>
  </footer>

</div>

<div id="modalOverlay" class="modal-overlay hidden">
  <form id="productForm" class="modal" novalidate>
    <h2 id="modalTitle">Novo lançamento</h2>

    <label class="field">
      <span>Nome do produto</span>
      <input required id="f-name" type="text" maxlength="80" placeholder="Ex: Linha Aurora">
    </label>

    <div class="field-row">
      <label class="field">
        <span>Categoria</span>
        <input required id="f-category" type="text" maxlength="40" list="categoryList" placeholder="Ex: Software">
        <datalist id="categoryList"></datalist>
      </label>

      <label class="field">
        <span>Data de lançamento</span>
        <input required id="f-date" type="date">
      </label>
    </div>

    <div class="field-row">
      <label class="field">
        <span>Status</span>
        <select id="f-status">
          <option value="andamento">Em andamento</option>
          <option value="concluido">Concluído</option>
          <option value="atrasado">Em atraso</option>
        </select>
      </label>

      <label class="field">
        <span>Responsável</span>
        <input id="f-owner" type="text" maxlength="60" placeholder="Ex: João">
      </label>
    </div>

    <label class="field">
      <span>Descrição curta</span>
      <textarea id="f-desc" maxlength="180" rows="3" placeholder="Ex: Web launch"></textarea>
    </label>

    <div class="modal-actions">
      <button type="button" id="deleteBtn" class="btn-danger hidden">Excluir</button>
      <div class="modal-actions-right">
        <button type="button" id="cancelBtn" class="btn-ghost">Cancelar</button>
        <button type="submit" class="btn-primary">Salvar</button>
      </div>
    </div>
  </form>
</div>

<div id="viewModalOverlay" class="modal-overlay hidden">
  <div class="modal view-modal">
    <h2>Visão de <span id="viewModalYear"></span></h2>
    <div id="viewImageWrap" class="view-image-wrap">
      <p id="viewLoading" class="view-loading">Gerando imagem...</p>
      <img id="viewImage" alt="Imagem da visão por trimestre" class="hidden">
    </div>
    <div class="modal-actions">
      <button type="button" id="downloadImageBtn" class="btn-ghost" disabled>Baixar imagem</button>
      <div class="modal-actions-right">
        <button type="button" id="closeViewBtn" class="btn-ghost">Fechar</button>
        <button type="button" id="generatePptBtn" class="btn-primary" disabled>Gerar PPT</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script>
(function () {
  'use strict';

  /* ============ Constants ============ */
  const STORAGE_KEY = 'launchRoadmap_v2';

  const MONTHS_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const MONTHS_SHORT_PT = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

  const STATUS_LABELS = {
    andamento: 'Em andamento',
    concluido: 'Concluído',
    atrasado: 'Em atraso'
  };
  const STATUS_ORDER = ['concluido', 'atrasado', 'andamento'];
  const STATUS_HEX_FILL = {
    concluido: 'E4F5EC',
    atrasado: 'FBE7E7',
    andamento: 'FFFFFF'
  };
  const STATUS_HEX_TEXT = {
    concluido: '14602F',
    atrasado: '8A1F1F',
    andamento: '15182B'
  };

  const CATEGORY_PALETTE = ['#2F6FED', '#14A085', '#D64550', '#F2A93B', '#7C5CFC', '#2CA6C7', '#6B8F3C', '#C2477B'];

  const QUARTERS = [
    { num: '01', label: 'Q1', months: [0, 1, 2] },
    { num: '02', label: 'Q2', months: [3, 4, 5] },
    { num: '03', label: 'Q3', months: [6, 7, 8] },
    { num: '04', label: 'Q4', months: [9, 10, 11] }
  ];

  const FALLBACK_SEED = {
    categoryColors: { 'Software': '#2F6FED', 'Hardware': '#14A085', 'Serviços': '#D64550' },
    products: [
      { id: 'seed-1', name: 'Vision Tools Portfolio', category: 'Software', date: '2026-02-10', status: 'concluido', owner: 'João', description: 'Web launch' },
      { id: 'seed-2', name: 'REVO 11K/16000', category: 'Hardware', date: '2026-08-14', status: 'andamento', owner: 'João', description: 'Web launch' },
      { id: 'seed-3', name: 'STP Tensor Pulse', category: 'Serviços', date: '2026-12-03', status: 'andamento', owner: 'João', description: 'Web launch' },
      { id: 'seed-4', name: 'SWS Nova Bomba', category: 'Hardware', date: '2026-06-20', status: 'atrasado', owner: 'João', description: 'Web launch' }
    ]
  };

  /* ============ State ============ */
  let state = {
    year: new Date().getFullYear(),
    products: [],
    categoryColors: {}
  };
  let activeCategoryFilters = new Set();
  let editingId = null;

  /* ============ DOM refs ============ */
  const $ = (id) => document.getElementById(id);
  const yearLabel = $('yearLabel');
  const categoryFilters = $('categoryFilters');
  const gridView = $('gridView');
  const gridCount = $('gridCount');
  const modalOverlay = $('modalOverlay');
  const productForm = $('productForm');
  const modalTitle = $('modalTitle');
  const deleteBtn = $('deleteBtn');
  const categoryList = $('categoryList');
  const toast = $('toast');

  const viewModalOverlay = $('viewModalOverlay');
  const viewModalYear = $('viewModalYear');
  const viewImageWrap = $('viewImageWrap');
  const viewLoading = $('viewLoading');
  const viewImage = $('viewImage');
  const downloadImageBtn = $('downloadImageBtn');
  const generatePptBtn = $('generatePptBtn');

  /* ============ Init ============ */
  async function init() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      try {
        state = JSON.parse(saved);
      } catch (e) {
        await loadSeed();
      }
    } else {
      await loadSeed();
    }
    if (!state.year) state.year = new Date().getFullYear();
    renderAll();
    bindEvents();
  }

  async function loadSeed() {
    let seed;
    try {
      const res = await fetch('data.json');
      if (!res.ok) throw new Error('not ok');
      seed = await res.json();
    } catch (e) {
      seed = FALLBACK_SEED;
    }
    state = {
      year: (seed.products && seed.products[0]) ? new Date(seed.products[0].date).getFullYear() : new Date().getFullYear(),
      products: seed.products || [],
      categoryColors: seed.categoryColors || {}
    };
    save();
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  /* ============ Category colors ============ */
  function getCategoryColor(cat) {
    if (!state.categoryColors[cat]) {
      const used = Object.keys(state.categoryColors).length;
      state.categoryColors[cat] = CATEGORY_PALETTE[used % CATEGORY_PALETTE.length];
    }
    return state.categoryColors[cat];
  }

  /* ============ Helpers ============ */
  function productsInYear(year) {
    return state.products.filter((p) => new Date(p.date + 'T00:00:00').getFullYear() === year);
  }

  function filteredProducts(year) {
    const all = productsInYear(year);
    if (activeCategoryFilters.size === 0) return all;
    return all.filter((p) => activeCategoryFilters.has(p.category));
  }

  function normalizedStatus(s) {
    return STATUS_LABELS[s] ? s : 'andamento';
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.remove('hidden');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.add('hidden'), 2600);
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  /* ============ Render orchestration ============ */
  function renderAll() {
    yearLabel.textContent = state.year;
    renderFilters();
    renderGrid();
  }

  /* ============ Filters ============ */
  function renderFilters() {
    const cats = [...new Set(productsInYear(state.year).map((p) => p.category))].sort();
    categoryFilters.innerHTML = '';
    if (cats.length === 0) return;
    cats.forEach((cat) => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'filter-chip' + (activeCategoryFilters.has(cat) ? ' active' : '');
      chip.style.color = getCategoryColor(cat);
      chip.innerHTML = `<span class="dot" style="background:${getCategoryColor(cat)}"></span>${escapeHtml(cat)}`;
      chip.addEventListener('click', () => {
        if (activeCategoryFilters.has(cat)) activeCategoryFilters.delete(cat);
        else activeCategoryFilters.add(cat);
        renderFilters();
        renderGrid();
      });
      categoryFilters.appendChild(chip);
    });
  }

  /* ============ Grid (by quarter, grouped by month) ============ */
  function renderGrid() {
    const items = filteredProducts(state.year);
    gridView.innerHTML = '';
    gridCount.textContent = items.length + (items.length === 1 ? ' lançamento' : ' lançamentos');

    QUARTERS.forEach((q) => {
      const col = document.createElement('div');
      col.className = 'quarter-col';
      col.setAttribute('data-qnum', q.num);

      const header = document.createElement('div');
      header.className = 'quarter-header';
      header.innerHTML = `<span class="qlabel">${q.label}</span><span class="qmonths">${MONTHS_SHORT_PT[q.months[0]]} – ${MONTHS_SHORT_PT[q.months[2]]}</span>`;
      col.appendChild(header);

      const body = document.createElement('div');
      body.className = 'quarter-cards';

      const qItems = items
        .filter((p) => q.months.includes(new Date(p.date + 'T00:00:00').getMonth()))
        .sort((a, b) => a.date.localeCompare(b.date));

      if (qItems.length === 0) {
        const empty = document.createElement('p');
        empty.className = 'quarter-empty';
        empty.textContent = 'Nenhum lançamento neste trimestre.';
        col.appendChild(empty);
      } else {
        q.months.forEach((m) => {
          const monthItems = qItems.filter((p) => new Date(p.date + 'T00:00:00').getMonth() === m);
          if (monthItems.length === 0) return;
          const group = document.createElement('div');
          group.className = 'month-group';
          const h4 = document.createElement('h4');
          h4.className = 'month-name';
          h4.textContent = MONTHS_PT[m];
          group.appendChild(h4);
          monthItems.forEach((p) => group.appendChild(buildLaunchBox(p)));
          body.appendChild(group);
        });
        col.appendChild(body);
      }

      gridView.appendChild(col);
    });
  }

  function buildLaunchBox(p) {
    const status = normalizedStatus(p.status);
    const box = document.createElement('div');
    box.className = `launch-box status-${status}`;

    const name = document.createElement('p');
    name.className = 'lb-name';
    name.textContent = p.name;
    box.appendChild(name);

    if (p.owner) {
      const owner = document.createElement('div');
      owner.className = 'lb-meta';
      owner.innerHTML = `<svg class="lb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"></path></svg><span>${escapeHtml(p.owner)}</span>`;
      box.appendChild(owner);
    }

    if (p.description) {
      const desc = document.createElement('p');
      desc.className = 'lb-desc';
      desc.textContent = p.description;
      box.appendChild(desc);
    }

    box.addEventListener('click', () => openModal(p));
    return box;
  }

  /* ============ Modal ============ */
  function openModal(product) {
    editingId = product ? product.id : null;
    modalTitle.textContent = product ? 'Editar lançamento' : 'Novo lançamento';
    deleteBtn.classList.toggle('hidden', !product);

    $('f-name').value = product ? product.name : '';
    $('f-category').value = product ? product.category : '';
    $('f-date').value = product ? product.date : '';
    $('f-status').value = product ? normalizedStatus(product.status) : 'andamento';
    $('f-owner').value = product ? (product.owner || '') : '';
    $('f-desc').value = product ? (product.description || '') : '';

    const cats = Object.keys(state.categoryColors);
    categoryList.innerHTML = cats.map((c) => `<option value="${escapeHtml(c)}">`).join('');

    modalOverlay.classList.remove('hidden');
    $('f-name').focus();
  }

  function closeModal() {
    modalOverlay.classList.add('hidden');
    productForm.reset();
    editingId = null;
  }

  function handleSubmit(e) {
    e.preventDefault();
    const name = $('f-name').value.trim();
    const category = $('f-category').value.trim();
    const date = $('f-date').value;
    if (!name || !category || !date) return;

    getCategoryColor(category);

    const payload = {
      id: editingId || ('p-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7)),
      name,
      category,
      date,
      status: normalizedStatus($('f-status').value),
      owner: $('f-owner').value.trim(),
      description: $('f-desc').value.trim()
    };

    if (editingId) {
      const idx = state.products.findIndex((p) => p.id === editingId);
      if (idx > -1) state.products[idx] = payload;
    } else {
      state.products.push(payload);
    }

    state.year = new Date(date + 'T00:00:00').getFullYear();

    save();
    renderAll();
    closeModal();
    showToast('Lançamento salvo.');
  }

  function handleDelete() {
    if (!editingId) return;
    if (!confirm('Excluir este lançamento?')) return;
    state.products = state.products.filter((p) => p.id !== editingId);
    save();
    renderAll();
    closeModal();
    showToast('Lançamento excluído.');
  }

  /* ============ Import / export ============ */
  function exportData() {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'data.json';
    a.click();
    URL.revokeObjectURL(url);
    showToast('Arquivo data.json exportado.');
  }

  function importData(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed.products) throw new Error('Formato inválido');
        state = {
          year: parsed.year || state.year,
          products: parsed.products,
          categoryColors: parsed.categoryColors || {}
        };
        save();
        renderAll();
        showToast('Dados importados com sucesso.');
      } catch (e) {
        showToast('Não foi possível ler este arquivo.');
      }
    };
    reader.readAsText(file);
  }

  /* ============ Year navigation ============ */
  function changeYear(delta) {
    state.year += delta;
    save();
    renderAll();
  }

  /* ============ Visão: generate image + PPT modal ============ */
  let lastImageDataUrl = null;

  async function openViewModal() {
    viewModalYear.textContent = state.year;
    viewImage.classList.add('hidden');
    viewLoading.classList.remove('hidden');
    viewLoading.textContent = 'Gerando imagem...';
    downloadImageBtn.disabled = true;
    generatePptBtn.disabled = true;
    lastImageDataUrl = null;
    viewModalOverlay.classList.remove('hidden');

    if (typeof html2canvas === 'undefined') {
      viewLoading.textContent = 'Não foi possível carregar o gerador de imagem. Verifique sua conexão e tente novamente.';
      return;
    }

    try {
      const target = document.querySelector('.board-section');
      const canvas = await html2canvas(target, {
        backgroundColor: '#F3F4F7',
        scale: 2,
        useCORS: true
      });
      lastImageDataUrl = canvas.toDataURL('image/png');
      viewImage.src = lastImageDataUrl;
      viewImage.classList.remove('hidden');
      viewLoading.classList.add('hidden');
      downloadImageBtn.disabled = false;
      generatePptBtn.disabled = false;
    } catch (e) {
      viewLoading.textContent = 'Não foi possível gerar a imagem.';
    }
  }

  function closeViewModal() {
    viewModalOverlay.classList.add('hidden');
  }

  function downloadImage() {
    if (!lastImageDataUrl) return;
    const a = document.createElement('a');
    a.href = lastImageDataUrl;
    a.download = `Visao-Lancamentos-${state.year}.png`;
    a.click();
  }

  /* ============ PPT generation ============ */
  function generatePpt() {
    if (typeof PptxGenJS === 'undefined') {
      showToast('Biblioteca de PPT ainda carregando, tente novamente em instantes.');
      return;
    }
    const items = filteredProducts(state.year).slice().sort((a, b) => a.date.localeCompare(b.date));
    const pptx = new PptxGenJS();
    pptx.defineLayout({ name: 'WIDE', width: 13.33, height: 7.5 });
    pptx.layout = 'WIDE';

    const slide = pptx.addSlide();
    slide.background = { color: 'FFFFFF' };

    slide.addText('Product Launch', { x: 0.4, y: 0.3, w: 6, h: 0.6, fontFace: 'Arial', fontSize: 28, bold: true, color: '15182B' });
    slide.addText(`Visão por trimestre — ${state.year}`, { x: 0.4, y: 0.85, w: 6, h: 0.4, fontFace: 'Arial', fontSize: 16, color: '565B72' });

    const colW = 2.95, gap = 0.25, startX = 0.4, colY = 1.7, colH = 5.2;
    QUARTERS.forEach((q, i) => {
      const x = startX + i * (colW + gap);
      slide.addText(q.label, { x, y: colY, w: colW, h: 0.32, fontFace: 'Arial', fontSize: 15, bold: true, color: '15182B' });
      slide.addShape(pptx.ShapeType.line, { x, y: colY + 0.38, w: colW, h: 0, line: { color: 'DEE1EA', width: 1 } });

      const qItems = items.filter((p) => q.months.includes(new Date(p.date + 'T00:00:00').getMonth()));
      let boxY = colY + 0.55;
      const boxH = 0.62, boxGap = 0.12;

      if (qItems.length === 0) {
        slide.addText('Nenhum lançamento', { x, y: boxY, w: colW, h: 0.3, fontFace: 'Arial', fontSize: 10.5, italic: true, color: '9AA0B4' });
      } else {
        let lastMonth = -1;
        qItems.forEach((p) => {
          const m = new Date(p.date + 'T00:00:00').getMonth();
          if (m !== lastMonth) {
            slide.addText(MONTHS_PT[m], { x, y: boxY, w: colW, h: 0.24, fontFace: 'Arial', fontSize: 10.5, bold: true, color: '15182B' });
            boxY += 0.26;
            lastMonth = m;
          }
          const status = normalizedStatus(p.status);
          slide.addShape(pptx.ShapeType.roundRect, {
            x, y: boxY, w: colW, h: boxH, rectRadius: 0.06,
            fill: { color: STATUS_HEX_FILL[status] },
            line: { color: '15182B', width: 1 }
          });
          const lines = [{ text: p.name, options: { bold: true, breakLine: true, fontSize: 9.5, color: STATUS_HEX_TEXT[status] } }];
          const subParts = [];
          if (p.owner) subParts.push(p.owner);
          if (p.description) subParts.push(p.description);
          if (subParts.length) lines.push({ text: subParts.join(' — '), options: { fontSize: 8, color: STATUS_HEX_TEXT[status] } });
          slide.addText(lines, { x: x + 0.08, y: boxY + 0.05, w: colW - 0.16, h: boxH - 0.1, fontFace: 'Arial', valign: 'top' });
          boxY += boxH + boxGap;
        });
      }
    });

    let legY = 7.05;
    slide.addText('Legenda', { x: 0.4, y: legY, w: 1.2, h: 0.22, fontFace: 'Arial', fontSize: 9, bold: true, color: '565B72' });
    STATUS_ORDER.forEach((s, i) => {
      const lx = 1.3 + i * 2.2;
      slide.addShape(pptx.ShapeType.roundRect, { x: lx, y: legY + 0.01, w: 0.18, h: 0.18, rectRadius: 0.03, fill: { color: STATUS_HEX_FILL[s] }, line: { color: '15182B', width: 1 } });
      slide.addText(STATUS_LABELS[s], { x: lx + 0.26, y: legY - 0.02, w: 1.8, h: 0.22, fontFace: 'Arial', fontSize: 9, color: '3A3F55' });
    });

    pptx.writeFile({ fileName: `Product-Launch-Agenda-${state.year}.pptx` });
    showToast('Gerando o arquivo PowerPoint...');
  }

  /* ============ Events ============ */
  function bindEvents() {
    $('prevYear').addEventListener('click', () => changeYear(-1));
    $('nextYear').addEventListener('click', () => changeYear(1));

    $('addBtn').addEventListener('click', () => openModal(null));
    $('cancelBtn').addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (!modalOverlay.classList.contains('hidden')) closeModal();
      if (!viewModalOverlay.classList.contains('hidden')) closeViewModal();
    });

    productForm.addEventListener('submit', handleSubmit);
    deleteBtn.addEventListener('click', handleDelete);

    $('exportBtn').addEventListener('click', exportData);
    $('importBtn').addEventListener('click', () => $('importFile').click());
    $('importFile').addEventListener('change', (e) => {
      if (e.target.files[0]) importData(e.target.files[0]);
      e.target.value = '';
    });

    $('viewBtn').addEventListener('click', openViewModal);
    $('closeViewBtn').addEventListener('click', closeViewModal);
    viewModalOverlay.addEventListener('click', (e) => { if (e.target === viewModalOverlay) closeViewModal(); });
    downloadImageBtn.addEventListener('click', downloadImage);
    generatePptBtn.addEventListener('click', generatePpt);
  }

  init();
})();

</script>
</body>
</html>
